name: Build & Push Docker image

# Mirrored from .github/workflows/docker.yml — keep the two in sync. The registry/image-name
# logic below already auto-detects the forge (via github.server_url, which Forgejo Actions
# also populates), so on Codeberg this pushes to codeberg.org/thj/codexa in Codeberg's
# container package registry instead of ghcr.io — no changes needed there.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: nothing here writes to the repo via the job token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Determine registry and image name
        id: reg
        run: |
          SERVER="${{ github.server_url }}"
          if [[ "$SERVER" == "https://github.com" ]]; then
            REGISTRY="ghcr.io"
          else
            REGISTRY="${SERVER#https://}"
          fi
          IMAGE="$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "host=$REGISTRY" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Compute image tags
        id: tags
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE="${{ steps.reg.outputs.image }}"
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            # Official release (git tag vX.Y.Z pushed) — update :latest and the versioned tag.
            VERSION="$GH_REF_NAME"
            VERSION="${VERSION#v}"
            TAGS="${IMAGE}:latest,${IMAGE}:${VERSION}"
          else
            # Plain push to main — publish under :dev only, never touch :latest.
            TAGS="${IMAGE}:dev"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to container registry
        uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push multi-platform image
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
