name: Deploy Codeberg Pages

# Codeberg Pages has no repo-settings toggle like GitHub Pages — it serves whatever's at
# the root of a branch named `pages` automatically, at https://thj.codeberg.page/codexa/.
# docs/ lives under main, so this copies it to the root of an orphan `pages` branch and
# force-pushes on every change, instead of maintaining a second copy by hand.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Least privilege: nothing here writes to the repo via the job token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Publish docs/ to pages branch
        env:
          # Passed as an env var rather than interpolated into the run script: an
          # expression-substituted secret is rendered into the step's command in the
          # job log and into any git error message that echoes the remote URL.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/pages-out
          cp -r docs/. /tmp/pages-out/

          git config user.name "codexa-bot"
          git config user.email "actions@noreply.codeberg.org"
          git checkout --orphan pages-deploy
          git rm -rf . > /dev/null
          cp -r /tmp/pages-out/. .
          git add -A
          git commit -m "Deploy docs from $GITHUB_SHA"
          git remote set-url --push origin "https://thj:${RELEASE_TOKEN}@codeberg.org/thj/codexa.git"
          git push --force origin pages-deploy:refs/heads/pages
